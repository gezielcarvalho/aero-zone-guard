version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aerozoneguard-backend
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_HTTP_PORTS=8080
    networks:
      - aerozoneguard-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aerozoneguard-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - aerozoneguard-network
    restart: unless-stopped

networks:
  aerozoneguard-network:
    driver: bridge
